<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDA Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1d20; font-family: 'Segoe UI', sans-serif; }
        .stat-card { background: #2b3035; border: 1px solid #495057; border-radius: 8px; }
        .table-dark { --bs-table-bg: #212529; }
        .badge-rx { background-color: #198754; }
        .badge-tx { background-color: #d63384; }
        .new-spot { animation: highlight 2s ease-out; }
        @keyframes highlight {
            0% { background-color: rgba(255, 193, 7, 0.3); }
            100% { background-color: transparent; }
        }
        #countdown { font-variant-numeric: tabular-nums; }
        .worked-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .spot-row:hover { background-color: rgba(255, 255, 255, 0.05); }
        .fading-out {
            animation: fadeOut 0.5s ease-out forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(-20px); }
        }
    </style>
</head>
<body class="p-3 p-md-4">

    <div class="container-fluid">
        <header class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
            <h2 class="text-info mb-0"><i class="fas fa-broadcast-tower"></i> RDA Monitor</h2>
            <div class="text-muted small">
                Автообновление: <span class="text-success">5 сек</span> |
                След. опрос PSK: <span id="countdown" class="text-warning fw-bold">--</span> сек
            </div>
        </header>

        <!-- Статистика -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-2">
                <div class="stat-card p-3 text-center">
                    <div class="text-muted small">Активных</div>
                    <div class="h3 text-info mb-0" id="stat-total">0</div>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="stat-card p-3 text-center">
                    <div class="text-muted small">👂 Слушают</div>
                    <div class="h3 text-success mb-0" id="stat-receivers">0</div>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="stat-card p-3 text-center">
                    <div class="text-muted small">📡 Передают</div>
                    <div class="h3 text-danger mb-0" id="stat-senders">0</div>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="stat-card p-3 text-center">
                    <div class="text-muted small">✅ Сработано</div>
                    <div class="h3 text-warning mb-0" id="stat-worked">0</div>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="stat-card p-3 text-center">
                    <div class="text-muted small">Уник. регионов</div>
                    <div class="h4 text-light mb-0" id="stat-regions">0</div>
                </div>
            </div>
            <div class="col-6 col-md-2">
                <div class="stat-card p-3 text-center">
                    <div class="text-muted small">Звук</div>
                    <button id="sound-toggle" class="btn btn-sm btn-outline-warning w-100">
                        <i class="fas fa-volume-up"></i> ВКЛ
                    </button>
                </div>
            </div>
        </div>

        <!-- Время сессии -->
        <div class="text-center text-muted small mb-3">
            ⏱️ Время сессии: <span id="stat-time" class="text-light">00:00:00</span>
        </div>

        <!-- Фильтры -->
        <div class="row mb-3 align-items-center">
            <div class="col-md-2 mb-2">
                <select id="filter-band" class="form-select form-select-sm">
                    <option value="">Все диапазоны</option>
                    {% for band in bands %}
                    <option value="{{ band }}">{{ band }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2 mb-2">
                <select id="filter-type" class="form-select form-select-sm">
                    <option value="">Все типы</option>
                    <option value="RECEIVER">👂 Слушают</option>
                    <option value="SENDER">📡 Передают</option>
                </select>
            </div>
            <div class="col-md-4 mb-2">
                <input type="text" id="filter-search" class="form-control form-control-sm" placeholder="Поиск позывного или региона...">
            </div>
        </div>

        <!-- Таблица -->
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover table-sm align-middle">
                <thead class="table-secondary text-dark">
                    <tr>
                        <th style="width: 40px;">✓</th>
                        <th>Время</th>
                        <th>Позывной</th>
                        <th>Тип</th>
                        <th>Регион</th>
                        <th>Название</th>
                        <th>Диапазон</th>
                        <th>Частота</th>
                    </tr>
                </thead>
                <tbody id="spots-table">
                    <tr><td colspan="8" class="text-center text-muted py-4">Ожидание данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let lastTotal = 0;
        let isFirstLoad = true;
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep() {
            if (!soundEnabled) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.error('Ошибка звука:', e);
            }
        }

        document.getElementById('sound-toggle').addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            this.innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i> ВКЛ' : '<i class="fas fa-volume-mute"></i> ВЫКЛ';
            this.classList.toggle('btn-outline-warning', soundEnabled);
            this.classList.toggle('btn-outline-secondary', !soundEnabled);
        });

        function markAsWorked(key, rowElement) {
            rowElement.classList.add('fading-out');

            fetch('/api/mark_worked', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    setTimeout(() => {
                        rowElement.remove();
                        fetchData();
                    }, 500);
                } else {
                    rowElement.classList.remove('fading-out');
                }
            })
            .catch(err => {
                console.error('Ошибка:', err);
                rowElement.classList.remove('fading-out');
            });
        }

        function fetchData() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('stat-total').innerText = data.stats.total;
                    document.getElementById('stat-receivers').innerText = data.stats.types.RECEIVER || 0;
                    document.getElementById('stat-senders').innerText = data.stats.types.SENDER || 0;
                    document.getElementById('stat-worked').innerText = data.stats.worked;
                    document.getElementById('stat-regions').innerText = data.stats.unique_regions;
                    document.getElementById('stat-time').innerText = data.stats.session_time;
                    document.getElementById('countdown').innerText = data.stats.next_poll_in;

                    if (!isFirstLoad && data.stats.total > lastTotal) {
                        playBeep();
                    }
                    lastTotal = data.stats.total;
                    isFirstLoad = false;

                    renderTable(data.spots);
                })
                .catch(err => console.error('Ошибка:', err));
        }

        function renderTable(spots) {
            const tbody = document.getElementById('spots-table');
            const filterBand = document.getElementById('filter-band').value;
            const filterType = document.getElementById('filter-type').value;
            const filterSearch = document.getElementById('filter-search').value.toLowerCase();

            if (!spots || spots.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Нет активных спотов 🎯</td></tr>';
                return;
            }

            const filtered = spots.filter(s => {
                const matchBand = !filterBand || s.band === filterBand;
                const matchType = !filterType || s.type === filterType;
                const matchSearch = !filterSearch ||
                    s.callsign.toLowerCase().includes(filterSearch) ||
                    s.region.toLowerCase().includes(filterSearch) ||
                    (s.region_name && s.region_name.toLowerCase().includes(filterSearch));
                return matchBand && matchType && matchSearch;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Ничего не найдено по фильтрам</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map((s, index) => {
                const typeBadge = s.type === 'RECEIVER'
                    ? '<span class="badge badge-rx">👂 СЛУШАЕТ</span>'
                    : '<span class="badge badge-tx">📡 ПЕРЕДАЁТ</span>';

                const isNew = (index === 0 && !isFirstLoad) ? 'new-spot' : '';
                const freqMhz = (s.frequency / 1000).toFixed(3);
                const regionName = s.region_name || '';
                const spotKey = `${s.callsign}_${s.band}_${s.mode}`;

                return `
                    <tr class="${isNew} spot-row" data-key="${spotKey}">
                        <td class="text-center">
                            <input type="checkbox"
                                   class="worked-checkbox"
                                   title="Отметить как сработанный"
                                   onchange="markAsWorked('${spotKey}', this.closest('tr'))">
                        </td>
                        <td class="text-nowrap">${s.time}</td>
                        <td class="fw-bold text-info">${s.callsign}</td>
                        <td>${typeBadge}</td>
                        <td><span class="badge bg-secondary">${s.region}</span></td>
                        <td class="text-light small">${regionName}</td>
                        <td><span class="badge bg-primary">${s.band}</span></td>
                        <td class="text-nowrap">${freqMhz} MHz</td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('filter-band').addEventListener('change', () => fetchData());
        document.getElementById('filter-type').addEventListener('change', () => fetchData());
        document.getElementById('filter-search').addEventListener('input', () => fetchData());

        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
